<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JSONbreadCrumb</title>
<style>
  :root {
    --bg: #f3f5f8; --panel: #ffffff; --panel-alt: #f4f7fb; --border: #e4e8ee;
    --text: #1e1e1e; --muted: #6b7785; --accent: #2f6fed; --accent-soft: #eaf1ff;
    --sel: #cfe3ff; --sel-text: #0a2540; --hover: #f0f4fa;
    --gutter: #f5f7fa; --gutter-text: #b0b8c2;
    --error-bg: #fdecea; --error-text: #b4232c; --ok-bg: #e6f6ec; --ok-text: #16824c;
    --header: #cfe0f7; --header-text: #1c3350;
    --mono: "SFMono-Regular", ui-monospace, Menlo, Consolas, "Liberation Mono", "Courier New", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --key: #0451a5; --str: #a31515; --num: #098658; --bool: #0000ff; --nul: #0000ff; --punc: #6b7785;
  }
  html[data-theme="dark"] {
    --bg: #171a1d; --panel: #1e1e1e; --panel-alt: #252526; --border: #303234;
    --text: #d4d4d4; --muted: #858b93; --accent: #4d8bff; --accent-soft: #0b2038;
    --sel: #094771; --sel-text: #ffffff; --hover: #2a2d2e;
    --gutter: #1e1e1e; --gutter-text: #6a7078;
    --error-bg: #3a1b1b; --error-text: #ff9ea3; --ok-bg: #14301f; --ok-text: #6fe0a3;
    --header: #6f9bd4; --header-text: #10233d;
    --key: #9cdcfe; --str: #ce9178; --num: #b5cea8; --bool: #569cd6; --nul: #569cd6; --punc: #808080;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); font-size: 13px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  header { display: flex; align-items: center; gap: 12px; padding: 6px 14px; background: var(--header); color: var(--header-text); flex: 0 0 auto; }
  header h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.2px; }
  .spacer { flex: 1; }
  .icon-btn { width: 28px; height: 28px; border-radius: 50%; border: 0; background: transparent; color: var(--header-text); cursor: pointer; display: grid; place-items: center; font-size: 16px; transition: background .12s; }
  .icon-btn:hover { background: rgba(0,0,0,.12); }

  main { flex: 1 1 auto; display: grid; grid-template-columns: 1fr 5px 1fr; min-height: 0; padding: 6px; gap: 0; }
  .panel { background: var(--panel); border: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .gutter-drag { cursor: col-resize; display: grid; place-items: center; }
  .gutter-drag::after { content: ""; width: 2px; height: 36px; background: var(--border); border-radius: 2px; }
  .gutter-drag:hover::after { background: var(--accent); }

  .find-bar { display: none; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--border); background: var(--panel-alt); flex: 0 0 auto; }
  body.show-find .find-bar { display: flex; }
  .find-ico { color: var(--muted); font-size: 12px; }
  #findInput { flex: 1; border: 1px solid var(--border); border-radius: 5px; padding: 5px 9px; font-size: 12.5px; background: var(--panel); color: var(--text); font-family: var(--sans); }
  #findInput:focus { outline: none; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .find-count { font-size: 11px; color: var(--muted); font-family: var(--mono); white-space: nowrap; min-width: 46px; text-align: center; }
  .find-nav { border: 1px solid var(--border); background: var(--panel); color: var(--muted); border-radius: 5px; padding: 4px 8px; cursor: pointer; font-size: 11px; line-height: 1; }
  .find-nav:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .find-hint { font-size: 10.5px; color: var(--muted); white-space: nowrap; }

  .editor-wrap { position: relative; flex: 1 1 auto; min-height: 0; display: flex; overflow: hidden; }
  .float-tools { position: absolute; top: 6px; right: 12px; z-index: 3; display: flex; gap: 5px; }
  .float-tools button { border: 1px solid var(--accent); background: var(--accent); color: #fff; padding: 3px 11px; border-radius: 3px; cursor: pointer; font-size: 12px; font-family: var(--sans); }
  .float-tools button.ghost { background: var(--panel); color: var(--accent); }
  .float-tools button:hover { filter: brightness(1.08); }

  .gutter { flex: 0 0 auto; background: var(--gutter); color: var(--gutter-text); overflow: hidden; border-right: 1px solid var(--border); min-width: 54px; font-family: var(--mono); font-size: 12.5px; line-height: 19px; padding: 7px 0 0 0; user-select: none; }
  .gln { display: flex; align-items: center; justify-content: flex-end; gap: 4px; height: 19px; padding-right: 7px; }
  .lnnum { min-width: 22px; text-align: right; }
  .fold { width: 11px; text-align: center; cursor: pointer; color: var(--muted); font-size: 9px; }
  .fold.empty { cursor: default; color: transparent; }
  .fold:hover:not(.empty) { color: var(--accent); }

  .code-area { position: relative; flex: 1 1 auto; min-width: 0; overflow: hidden; }
  .highlight, #editor { margin: 0; padding: 7px 11px; font-family: var(--mono); font-size: 12.5px; line-height: 19px; letter-spacing: 0; tab-size: 2; white-space: pre; word-wrap: normal; border: 0; }
  .highlight { position: absolute; inset: 0; overflow: hidden; pointer-events: none; color: var(--text); background: var(--panel); }
  .highlight code { display: block; }
  #editor { position: absolute; inset: 0; resize: none; outline: 0; background: transparent; color: transparent; caret-color: var(--text); overflow: auto; }
  #editor::selection { background: rgba(77,139,255,.40); }
  #editor.plain { color: var(--text); }
  #editor.readonly-fold { caret-color: transparent; }
  .tk-key { color: var(--key); } .tk-str { color: var(--str); } .tk-num { color: var(--num); }
  .tk-bool { color: var(--bool); } .tk-null { color: var(--nul); } .tk-punc { color: var(--punc); }
  .tk-fold { color: var(--muted); font-style: italic; }
  mark.emark { background: #ffd94a; color: #1c2733; border-radius: 2px; }
  mark.emark.current { background: #ff9500; }

  .statusbar { flex: 0 0 auto; display: none; align-items: center; gap: 10px; padding: 4px 9px; border-top: 1px solid var(--border); background: var(--panel-alt); font-size: 11px; }
  body.show-status .statusbar { display: flex; }
  .status-pill { padding: 1px 7px; border-radius: 20px; font-weight: 600; font-size: 10.5px; }
  .status-pill.ok { background: var(--ok-bg); color: var(--ok-text); }
  .status-pill.err { background: var(--error-bg); color: var(--error-text); }
  .status-msg { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status-meta { margin-left: auto; color: var(--muted); font-family: var(--mono); }

  .pathbar { flex: 0 0 auto; border-bottom: 1px solid var(--border); background: var(--panel); padding: 7px 9px; }
  .path-main { display: flex; align-items: stretch; gap: 0; }
  .path-tag { display: flex; align-items: center; padding: 0 11px; border: 1px solid var(--border); border-right: 0; border-radius: 3px 0 0 3px; background: var(--panel-alt); font-size: 12.5px; color: var(--text); white-space: nowrap; }
  #pathOut { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12.5px; border: 1px solid var(--border); border-right: 0; padding: 6px 9px; background: var(--panel); color: var(--text); outline: none; }
  #pathOut::placeholder { color: var(--muted); font-family: var(--sans); font-style: italic; }
  #pathOut:focus { box-shadow: inset 0 0 0 1px var(--accent); }
  .copy-btn { border: 1px solid var(--border); background: var(--panel-alt); color: var(--text); padding: 0 14px; cursor: pointer; font-size: 12.5px; white-space: nowrap; }
  .copy-btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .search-toggle { border: 1px solid var(--border); border-left: 0; background: var(--panel-alt); color: var(--muted); padding: 0 9px; cursor: pointer; font-size: 13px; line-height: 1; }
  .search-toggle:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .search-toggle.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .more-btn { border: 1px solid var(--border); border-left: 0; background: var(--panel-alt); color: var(--muted); padding: 0 9px; border-radius: 0 3px 3px 0; cursor: pointer; font-size: 15px; line-height: 1; }
  .more-btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .more-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .search-bar { display: none; margin-top: 7px; align-items: center; gap: 6px; }
  body.show-search .search-bar { display: flex; }
  .search-ico2 { color: var(--muted); font-size: 12px; }
  #search { flex: 1; border: 1px solid var(--border); border-radius: 5px; padding: 6px 9px; font-size: 12.5px; background: var(--panel); color: var(--text); font-family: var(--sans); }
  #search:focus { outline: none; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .search-count { font-size: 11px; color: var(--muted); font-family: var(--mono); white-space: nowrap; }
  .search-nav { border: 1px solid var(--border); background: var(--panel-alt); color: var(--muted); border-radius: 5px; padding: 4px 8px; cursor: pointer; font-size: 11px; }
  .search-nav:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  .options { display: none; margin-top: 7px; padding-top: 7px; border-top: 1px dashed var(--border); flex-wrap: wrap; align-items: center; gap: 5px; }
  body.show-options .options { display: flex; }
  .opt-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-right: 2px; }
  .fmt { border: 1px solid var(--border); background: var(--panel); color: var(--muted); padding: 2px 8px; border-radius: 20px; font-size: 11px; cursor: pointer; }
  .fmt.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .fmt:not(.active):hover { border-color: var(--accent); color: var(--accent); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 5px; overflow: hidden; }
  .seg button { border: 0; background: var(--panel); color: var(--muted); padding: 3px 8px; cursor: pointer; font-size: 11px; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.active { background: var(--accent); color: #fff; }
  .tbtn { border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 3px 7px; border-radius: 5px; cursor: pointer; font-size: 11px; }
  .tbtn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .tbtn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tbtn.danger:hover { background: var(--error-bg); border-color: var(--error-text); color: var(--error-text); }
  .val-line { display: none; margin-top: 5px; align-items: center; gap: 7px; font-size: 11.5px; }
  body.show-options .val-line { display: flex; }
  #valOut { flex: 1; font-family: var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .tree-scroll { flex: 1 1 auto; overflow: auto; min-height: 0; padding: 3px 0; }
  .tree { font-family: var(--mono); font-size: 13px; }
  .empty-state { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); gap: 8px; padding: 24px; text-align: center; }
  .empty-state .big { font-size: 30px; opacity: .5; }
  .empty-state .sub { font-size: 12.5px; max-width: 240px; line-height: 1.5; }

  .search-results { display: none; }
  .sr-head { padding: 6px 10px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--border); font-family: var(--sans); }
  .sr-item { padding: 6px 10px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
  .sr-item:hover { background: var(--hover); }
  .sr-path { font-family: var(--mono); font-size: 12px; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sr-val { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sr-tag { font-family: var(--sans); font-size: 9px; text-transform: uppercase; letter-spacing: .3px; color: var(--muted); border: 1px solid var(--border); border-radius: 8px; padding: 0 5px; margin-left: 6px; }

  .node-row { display: flex; align-items: center; gap: 2px; cursor: pointer; white-space: nowrap; padding: 2px 8px 2px 0; line-height: 18px; }
  .node-row:hover:not(.selected) { background: var(--hover); }
  .node-row.selected { background: var(--sel); }
  .node-row.selected, .node-row.selected * { color: var(--sel-text) !important; }
  .node-row.flash { animation: rowflash .9s ease; }
  @keyframes rowflash { 0%,100%{ background: var(--sel); } 25%,60%{ background: #f0c419; } }
  .node-row.branch .node-label { cursor: pointer; }
  .twist { width: 18px; flex: 0 0 18px; text-align: center; color: var(--muted); user-select: none; transition: transform .12s; font-size: 13px; line-height: 1; }
  .twist:hover { color: var(--accent); }
  .twist.leaf { visibility: hidden; }
  .node.collapsed > .node-row .twist { transform: rotate(-90deg); }
  .node.collapsed > .children { display: none; }
  .node-label { display: inline-flex; align-items: baseline; min-width: 0; }
  .k { color: var(--key); }
  .colon { color: var(--muted); margin: 0 8px 0 1px; }
  .v-string { color: var(--str); }
  .v-number { color: var(--num); }
  .v-boolean { color: var(--bool); }
  .v-null { color: var(--nul); }
  .brace { color: var(--muted); }
  .count { color: var(--muted); font-size: 11px; margin-left: 7px; font-style: italic; }
  .type-badge { display: none; font-family: var(--sans); font-size: 9px; margin-left: 7px; padding: 0 5px; border-radius: 8px; background: var(--panel-alt); color: var(--muted); border: 1px solid var(--border); text-transform: uppercase; letter-spacing: .3px; }
  .tree.show-types .type-badge { display: inline-block; }
  mark.hit { background: #ffd94a; color: #1c2733; border-radius: 2px; padding: 0 1px; }
  .tree.view-rows .q { display: none; }
  .tree.view-rows .brace, .tree.view-rows .count { display: none; }
  .tree.view-rows .node.collapsed > .node-row .brace,
  .tree.view-rows .node.collapsed > .node-row .count { display: inline; }
  .tree.view-code .children { position: relative; }
  .tree.view-code .children::before { content: ""; position: absolute; left: 7px; top: 0; bottom: 3px; width: 1px; background: var(--border); }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(18px); background: #1c2733; color: #fff; padding: 8px 15px; border-radius: 7px; font-size: 12.5px; opacity: 0; pointer-events: none; transition: all .2s; z-index: 50; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 820px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 5px 1fr; } .gutter-drag { cursor: row-resize; } }
</style>
</head>
<body>
  <header>
    <h1>🍞 JSONbreadCrumb</h1>
    <div class="spacer"></div>
    <button class="icon-btn" id="themeBtn" title="Toggle theme">◐</button>
  </header>

  <main>
    <section class="panel" id="leftPanel">
      <div class="find-bar" id="findBar">
        <span class="find-ico">🔍</span>
        <input id="findInput" placeholder="Find in raw JSON…" />
        <span class="find-count" id="findCount">0/0</span>
        <button class="find-nav" id="findPrev" title="Previous (Shift+Enter)">◀</button>
        <button class="find-nav" id="findNext" title="Next (Enter)">▶</button>
        <span class="find-hint">Enter ↵ next · dbl-click a value → jump right</span>
        <button class="find-nav" id="findClose" title="Close (Esc)">✕</button>
      </div>
      <div class="editor-wrap">
        <div class="float-tools">
          <button id="findToggle" class="ghost" title="Find in editor (Ctrl+F)">Find</button>
          <button id="sampleBtn" title="Load sample JSON">Sample</button>
          <button id="beautifyBtn" title="Pretty-print">Beautify</button>
          <button id="minifyBtn" title="Compact">Minify</button>
        </div>
        <div class="gutter" id="gutter"></div>
        <div class="code-area">
          <pre class="highlight" id="highlightPre"><code id="highlightCode"></code></pre>
          <textarea id="editor" spellcheck="false" wrap="off" placeholder="Paste your JSON here… (double-click any key or value to jump to it in the tree)"></textarea>
        </div>
      </div>
      <div class="statusbar">
        <span class="status-pill ok" id="statusPill">Ready</span>
        <span class="status-msg" id="statusMsg">Ready.</span>
        <span class="status-meta" id="statusMeta"></span>
      </div>
    </section>

    <div class="gutter-drag" id="dragBar"></div>

    <section class="panel" id="rightPanel">
      <div class="pathbar">
        <div class="path-main">
          <span class="path-tag">Path:</span>
          <input id="pathOut" spellcheck="false" placeholder="Select a node — or type a path and press Enter to jump" />
          <button class="copy-btn" id="copyPathBtn">Copy</button>
          <button class="search-toggle" id="searchToggle" title="Search the tree">🔍</button>
          <button class="more-btn" id="optionsBtn" title="More options">⋯</button>
        </div>

        <div class="search-bar" id="searchBar">
          <span class="search-ico2">🔍</span>
          <input id="search" placeholder="Search keys & values — click a result to jump…" />
          <span class="search-count" id="searchCount"></span>
          <button class="search-nav" id="searchClear" title="Clear / close">✕</button>
        </div>

        <div class="options" id="optionsRow">
          <span class="opt-label">Format</span>
          <button class="fmt active" data-fmt="var">x.notation</button>
          <button class="fmt" data-fmt="jsonpath">JSONPath</button>
          <button class="fmt" data-fmt="bracket">Bracket</button>
          <button class="fmt" data-fmt="pointer">Pointer</button>
          <span style="width:6px"></span>
          <span class="opt-label">View</span>
          <div class="seg" id="viewSeg">
            <button data-view="rows" class="active">Rows</button>
            <button data-view="code">Code</button>
          </div>
          <button class="tbtn" id="typesBtn" title="Show/hide type labels">Types</button>
          <button class="tbtn" id="expandBtn" title="Expand all">Expand</button>
          <button class="tbtn" id="collapseBtn" title="Collapse all">Collapse</button>
          <span style="flex:1"></span>
          <button class="tbtn" id="uploadBtn" title="Open a .json file">Upload</button>
          <button class="tbtn danger" id="clearBtn" title="Clear editor">Clear</button>
          <input type="file" id="fileInput" accept=".json,application/json,.txt" hidden />
        </div>
        <div class="val-line">
          <span class="opt-label">Value</span>
          <span id="valOut">—</span>
          <button class="tbtn" id="copyValBtn">⧉ Copy value</button>
        </div>
      </div>

      <div class="tree-scroll" id="treeScroll">
        <div class="empty-state" id="emptyState">
          <div class="big">🍞</div>
          <div class="sub">Your JSON tree appears here. Click any row to get its path.</div>
        </div>
        <div class="tree view-rows" id="tree" style="display:none" tabindex="0"></div>
        <div class="search-results" id="searchResults"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast">Copied!</div>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const editor=$("editor"), gutter=$("gutter"), highlightPre=$("highlightPre"), highlightCode=$("highlightCode"),
        tree=$("tree"), emptyState=$("emptyState"), searchResults=$("searchResults"),
        statusPill=$("statusPill"), statusMsg=$("statusMsg"), statusMeta=$("statusMeta"),
        pathOut=$("pathOut"), valOut=$("valOut"),
        searchInput=$("search"), searchCount=$("searchCount"),
        findInput=$("findInput"), findCount=$("findCount"),
        toast=$("toast");

  let parsed=null, selectedRow=null, selectedSegs=null, selectedValue=undefined;
  let currentFormat="var", viewMode="rows", showTypes=false, debounceTimer=null;
  let fullText="";
  let foldPairs=new Map();
  let folds=[];
  let posIndex=null, posIndexText=null;
  let baseHTML="";
  let searchIndex=null, searchIndexRef=null;
  let markEls=[];
  let findQuery="", findMatches=[], findPos=-1;
  const LINE_H=19;
  const MAX_HL=8000000, EXPANDALL_BUDGET=4000, MAX_MATCHES=500, BIG_STATS=400000, MARK_LIMIT=3000;

  const SAMPLE = { instructions: [ "Enter your JSON in the editor.", "Select an item to view its path.", "Replace 'x' with the name of your variable." ] };

  function showToast(m){ toast.textContent=m; toast.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>toast.classList.remove("show"),1500); }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  const IDENT=/^[A-Za-z_$][A-Za-z0-9_$]*$/;
  function copyText(t){ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>showToast("Copied!"),()=>fb(t));}else fb(t);
    function fb(x){const ta=document.createElement("textarea");ta.value=x;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");showToast("Copied!");}catch(e){showToast("Copy failed");}document.body.removeChild(ta);} }
  function typeOf(v){ if(v===null)return "null"; if(Array.isArray(v))return "array"; return typeof v; }
  function fmtBytes(b){ if(b<1024)return b+" B"; if(b<1048576)return (b/1024).toFixed(1)+" KB"; return (b/1048576).toFixed(2)+" MB"; }

  function buildPath(segs,fmt){
    if(fmt==="pointer"){ if(!segs.length)return ""; return segs.map(s=>"/"+String(s.key).replace(/~/g,"~0").replace(/\//g,"~1")).join(""); }

  function computeFoldable(text){
    const pairs=new Map(); const stack=[]; let line=0, inStr=false, esc=false;

  function buildLabelHtml(key,value,type,childKeys){

  function ensurePathRendered(segs){

  function build(){
    const text=fullText;
    if(!text.trim()){ parsed=null; searchIndex=null; tree.style.display="none"; searchResults.style.display="none"; emptyState.style.display="flex"; setStatus("ready","Ready","Ready.",""); clearSelection(); searchCount.textContent=""; return; }

    const t0=performance.now();

    const t1=performance.now();
    if(searchInput.value.trim()) applySearch(); else searchResults.style.display="none";
    let meta;

  function countNodes(v,d){ let nodes=1,md=d; if(v&&typeof v==="object"){ const ks=Array.isArray(v)?v.map((_,i)=>i):Object.keys(v); for(const k of ks){ const r=countNodes(v[k],d+1); nodes+=r.nodes; if(r.maxDepth>md)md=r.maxDepth; } } return {nodes,maxDepth:md}; }

  function buildSearchIndex(){
    const entries=[];
    (function walk(v,segs){
      const t=typeOf(v);

        for(const k of keys){ const seg={key:k,isIndex:arr}; const csegs=segs.concat([seg]); const cv=v[k]; const ct=typeOf(cv); const leaf=!(ct==="object"||ct==="array");

  function getSearchIndex(){ if(searchIndexRef!==parsed || searchIndex===null){ searchIndex=buildSearchIndex(); searchIndexRef=parsed; } return searchIndex; }
  function applySearch(){
    const q=searchInput.value.trim().toLowerCase();
    if(parsed===null){ searchCount.textContent=""; searchResults.style.display="none"; return; }
    if(!q){ searchResults.style.display="none"; searchResults.innerHTML=""; tree.style.display="block"; searchCount.textContent=""; return; }
    const index=getSearchIndex();
    const matches=[];
    for(let i=0;i<index.length;i++){
      const e=index[i];
      const keyMatch=e.kl.indexOf(q)!==-1;
      const valMatch=e.vl!==null && e.vl.indexOf(q)!==-1;
      if(keyMatch||valMatch){ matches.push({segs:e.segs,value:e.value,kind:keyMatch?(valMatch?"key+value":"key"):"value"}); if(matches.length>=MAX_MATCHES) break; }

  function hi(text,q){ const t=String(text); const i=t.toLowerCase().indexOf(q); if(i<0) return escapeHtml(t); return escapeHtml(t.slice(0,i))+"<mark class='hit'>"+escapeHtml(t.slice(i,i+q.length))+"</mark>"+escapeHtml(t.slice(i+q.length)); }

    const head=document.createElement("div"); head.className="sr-head";
    head.textContent=(capped?"Showing first 500":matches.length+" result"+(matches.length===1?"":"s"))+" — click one to jump to it";
    searchResults.appendChild(head);
    const frag=document.createDocumentFragment();
    for(const m of matches){
      const item=document.createElement("div"); item.className="sr-item"; item.dataset.segs=JSON.stringify(m.segs);
      const pathStr=buildPath(m.segs,currentFormat);
      const pathHtml = m.kind==="value" ? escapeHtml(pathStr) : (function(){ const lastKey=String(m.segs[m.segs.length-1].key); const idx=pathStr.toLowerCase().lastIndexOf(lastKey.toLowerCase()); if(idx<0) return escapeHtml(pathStr); return escapeHtml(pathStr.slice(0,idx))+hi(pathStr.slice(idx,idx+lastKey.length),q)+escapeHtml(pathStr.slice(idx+lastKey.length)); })();

    searchCount.textContent=(capped?"500+":matches.length)+" hit"+(matches.length===1?"":"s");
  }

  function computeFindMatches(){ findMatches=[]; findPos=-1; const q=findQuery; if(!q) return; const hay=fullText.toLowerCase(); let i=0,idx; while((idx=hay.indexOf(q,i))>=0){ findMatches.push(idx); i=idx+q.length; if(findMatches.length>50000) break; } }
  function updateFindCount(){ const n=findMatches.length; findCount.textContent=(n?((findPos>=0?findPos+1:0)+"/"+(n>9999?"9999+":n)):"0/0"); }
  function runFind(){
    findQuery=findInput.value.trim().toLowerCase();
    computeFindMatches(); updateFindCount();
    if(findQuery && folds.length){ unfoldAll(); computeFindMatches(); }
    repaintOverlay();
  }
  function gotoFind(dir){
    if(!findQuery){ return; }
    if(!findMatches.length){ showToast("No matches"); return; }
    if(folds.length){ unfoldAll(); computeFindMatches(); repaintOverlay(); }
    findPos=(findPos+dir+findMatches.length)%findMatches.length;
    const off=findMatches[findPos];
    editor.focus(); try{ editor.setSelectionRange(off,off+findQuery.length); }catch(_){}
    const line=fullText.slice(0,off).split("\n").length-1;
    editor.scrollTop=Math.max(0,(line-5))*LINE_H; syncScroll();
    if(markEls.length===findMatches.length){ setCurrentMark(); } else { repaintOverlay(); }
    updateFindCount();
  }
  function openFind(){ document.body.classList.add("show-find"); $("findToggle").classList.add("active"); findInput.focus(); findInput.select(); if(findInput.value.trim()) runFind(); }
  function closeFind(){ document.body.classList.remove("show-find"); $("findToggle").classList.remove("active"); findInput.value=""; findQuery=""; findMatches=[]; findPos=-1; markEls=[]; repaintOverlay(); }

  function scheduleBuild(){ clearTimeout(debounceTimer); debounceTimer=setTimeout(()=>{ refreshFromTyping(); build(); },220); }
  editor.addEventListener("input",()=>{ if(editor.readOnly) return; scheduleBuild(); });
  editor.addEventListener("scroll",syncScroll);
  editor.addEventListener("dblclick",()=>{
    if(folds.length){ unfoldAll(); showToast("Unfolded — double-click again"); return; }
    if(parsed===null) return;
    const caret=editor.selectionStart; const idx=getIndex(); let best=null;
    for(const e of idx){ if(caret>=e.s && caret<e.e){ if(!best || (e.e-e.s)<(best.e-best.s)) best=e; } }
    if(best) navigateToSegs(best.segs,false);
  });
  editor.addEventListener("keydown",(e)=>{
    if(editor.readOnly && folds.length){ if(e.key.length===1 || e.key==="Enter" || e.key==="Backspace" || e.key==="Delete"){ unfoldAll(); } }
    if(e.key==="Tab" && !editor.readOnly){ e.preventDefault(); const s=editor.selectionStart,en=editor.selectionEnd; editor.value=editor.value.slice(0,s)+"  "+editor.value.slice(en); editor.selectionStart=editor.selectionEnd=s+2; scheduleBuild(); }
    if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){ e.preventDefault(); refreshFromTyping(); build(); }
  });
  gutter.addEventListener("click",(e)=>{ const f=e.target.closest(".fold"); if(!f||f.classList.contains("empty"))return; toggleFold(Number(f.dataset.line)); });

  $("findToggle").addEventListener("click",()=>{ if(document.body.classList.contains("show-find")) closeFind(); else openFind(); });
  $("findClose").addEventListener("click",closeFind);
  $("findPrev").addEventListener("click",()=>gotoFind(-1));
  $("findNext").addEventListener("click",()=>gotoFind(1));
  findInput.addEventListener("input",()=>{ clearTimeout(findInput._t); findInput._t=setTimeout(runFind,150); });
  findInput.addEventListener("keydown",(e)=>{ if(e.key==="Enter"){ e.preventDefault(); gotoFind(e.shiftKey?-1:1); } else if(e.key==="Escape"){ closeFind(); } });

  $("sampleBtn").addEventListener("click",()=>{ loadText(JSON.stringify(SAMPLE,null,2)); });
  $("beautifyBtn").addEventListener("click",()=>{ try{ loadText(JSON.stringify(JSON.parse(fullText),null,2)); showToast("Beautified"); }catch(e){ showToast("Fix JSON errors first"); } });
  $("minifyBtn").addEventListener("click",()=>{ try{ loadText(JSON.stringify(JSON.parse(fullText))); showToast("Minified"); }catch(e){ showToast("Fix JSON errors first"); } });
  $("clearBtn").addEventListener("click",()=>{ searchInput.value=""; findInput.value=""; findQuery=""; clearSelection(); loadText(""); });
  $("uploadBtn").addEventListener("click",()=>$("fileInput").click());
  $("fileInput").addEventListener("change",(e)=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ loadText(String(r.result)); showToast("Loaded "+f.name); }; r.readAsText(f); e.target.value=""; });
  editor.addEventListener("dragover",(e)=>e.preventDefault());
  editor.addEventListener("drop",(e)=>{ e.preventDefault(); const f=e.dataTransfer.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ loadText(String(r.result)); showToast("Loaded "+f.name); }; r.readAsText(f); });

  document.querySelector(".options").addEventListener("click",(e)=>{ const b=e.target.closest(".fmt"); if(!b)return; document.querySelectorAll(".fmt").forEach(x=>x.classList.remove("active")); b.classList.add("active"); currentFormat=b.dataset.fmt; updatePathDisplay(); if(searchInput.value.trim()) applySearch(); });
  $("copyPathBtn").addEventListener("click",()=>{ if(!pathOut.value.trim()){ showToast("Select a node first"); return; } copyText(pathOut.value); });
  $("copyValBtn").addEventListener("click",()=>{ if(selectedValue===undefined){ showToast("Select a node first"); return; } copyText(valueForCopy(selectedValue)); });
  pathOut.addEventListener("keydown",(e)=>{ if(e.key==="Enter"){ e.preventDefault(); jumpToPath(pathOut.value); } });

  searchInput.addEventListener("input",()=>{ clearTimeout(searchInput._t); searchInput._t=setTimeout(applySearch,150); });
  searchInput.addEventListener("keydown",(e)=>{ if(e.key==="Escape") closeSearch(); });
  function openSearch(){ document.body.classList.add("show-search"); $("searchToggle").classList.add("active"); searchInput.focus(); searchInput.select(); if(searchInput.value.trim()) applySearch(); }
  function closeSearch(){ document.body.classList.remove("show-search"); $("searchToggle").classList.remove("active"); searchInput.value=""; searchResults.style.display="none"; searchResults.innerHTML=""; searchCount.textContent=""; if(parsed!==null) tree.style.display="block"; }
  $("searchToggle").addEventListener("click",()=>{ if(document.body.classList.contains("show-search")) closeSearch(); else openSearch(); });
  $("searchClear").addEventListener("click",()=>{ if(searchInput.value){ searchInput.value=""; applySearch(); searchInput.focus(); } else closeSearch(); });

  document.addEventListener("keydown",(e)=>{ if((e.ctrlKey||e.metaKey)&&(e.key==="f"||e.key==="F")){ e.preventDefault(); openFind(); } });

  $("expandBtn").addEventListener("click",()=>{ if(parsed===null)return; const done=expandBudget(EXPANDALL_BUDGET); reselect(); if(!done) showToast("Expanded first "+EXPANDALL_BUDGET+" nodes (large file)"); });
  $("collapseBtn").addEventListener("click",()=>{ collapseAll(); reselect(); });

  $("viewSeg").addEventListener("click",(e)=>{ const b=e.target.closest("button"); if(!b)return; viewMode=b.dataset.view; $("viewSeg").querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b)); tree.classList.remove("view-rows","view-code"); tree.classList.add("view-"+viewMode); });
  $("typesBtn").addEventListener("click",()=>{ showTypes=!showTypes; $("typesBtn").classList.toggle("active",showTypes); tree.classList.toggle("show-types",showTypes); });
  $("optionsBtn").addEventListener("click",()=>{ const on=document.body.classList.toggle("show-options"); document.body.classList.toggle("show-status",on); $("optionsBtn").classList.toggle("active",on); });

  document.addEventListener("keydown",(e)=>{
    if(!selectedRow) return;
    const a=document.activeElement; if(a===editor||a===searchInput||a===pathOut||a===findInput) return;
    if(!["ArrowDown","ArrowUp","ArrowRight","ArrowLeft"].includes(e.key)) return;
    e.preventDefault(); const node=selectedRow.parentElement;
    if(e.key==="ArrowRight"){ if(node._hasChildren){ if(node.classList.contains("collapsed")){ if(!node._built) buildChildren(node); node.classList.remove("collapsed"); } else { const c=node.querySelector(":scope > .children > .node > .node-row"); if(c) selectRow(c,JSON.parse(c.dataset.segs),c._value);} } return; }
    if(e.key==="ArrowLeft"){ if(node._hasChildren&&!node.classList.contains("collapsed")){ node.classList.add("collapsed"); } else { const p=node.parentElement.closest(".node"); if(p){ const pr=p.querySelector(":scope > .node-row"); selectRow(pr,JSON.parse(pr.dataset.segs),pr._value);} } return; }
    const rows=Array.from(tree.querySelectorAll(".node-row")).filter(r=>r.offsetParent!==null); const idx=rows.indexOf(selectedRow);
    const next = e.key==="ArrowDown"? rows[idx+1] : rows[idx-1];
    if(next) selectRow(next,JSON.parse(next.dataset.segs),next._value);
  });

  const themeBtn=$("themeBtn");
  function applyTheme(t){ document.documentElement.setAttribute("data-theme",t); try{localStorage.setItem("jbc-theme",t);}catch(e){} }
  themeBtn.addEventListener("click",()=>applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark"));
  try{ const s=localStorage.getItem("jbc-theme"); if(s)applyTheme(s); }catch(e){}

  (function(){ const bar=$("dragBar"),main=document.querySelector("main"); let d=false;
    bar.addEventListener("mousedown",()=>{d=true;document.body.style.userSelect="none";});
    window.addEventListener("mouseup",()=>{d=false;document.body.style.userSelect="";});
    window.addEventListener("mousemove",(e)=>{ if(!d)return; const r=main.getBoundingClientRect(); if(window.innerWidth>820){ let ratio=(e.clientX-r.left)/r.width; ratio=Math.min(.8,Math.max(.2,ratio)); main.style.gridTemplateColumns=ratio+"fr 5px "+(1-ratio)+"fr"; } });
  })();

  loadText(JSON.stringify(SAMPLE,null,2));
})();
</script>
</body>
</html>
